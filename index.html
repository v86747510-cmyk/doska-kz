
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Доска</title>
<style>
body { font-family: Arial; background: #f0f0f0; padding: 20px; }
h1 { color: #333; text-align: center; }
.container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
input, button { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ddd; }
button { background: #4CAF50; color: white; cursor: pointer; }
button:hover { background: #45a049; }
.note { background: #fff9c4; padding: 10px; margin: 10px 0; border-radius: 5px; }
</style>
</head>
<body>
<div class="container">
<h1>📝 Моя Доска</h1>
<input type="text" id="noteInput" placeholder="Напиши заметку...">
<button onclick="addNote()">Добавить</button>
<div id="notes"></div>
</div>

<script>
function addNote() {
let input = document.getElementById("noteInput");
let noteText = input.value;
if (noteText === "") return;

let noteDiv = document.createElement("div");
noteDiv.className = "note";
noteDiv.innerHTML = noteText + ' <button onclick="this.parentElement.remove()">X</button>';
document.getElementById("notes").appendChild(noteDiv);

input.value = "";
}
</script>
</body>
</html>
