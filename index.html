<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Доска: ТОЛЬКО КУПЛЮ</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    h1 { text-align: center; color: #ff5722; }
    input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; }
    button { background: #ff5722; color: white; border: none; cursor: pointer; font-weight: bold; }
    .ad { background: #fff3e0; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #ff5722; }
    .ad b { color: #e65100; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📢 Доска: ТОЛЬКО КУПЛЮ</h1>
    
    <h3>Добавить объявление</h3>
    <input id="what" placeholder="Что куплю? Например: iPhone 13">
    <input id="price" placeholder="Цена до: 300000 тг">
    <input id="contact" placeholder="Контакты: WhatsApp / Телефон">
    <button onclick="addAd()">Опубликовать</button>

    <h3>Объявления</h3>
    <div id="ads"></div>
  </div>

<script>
// Пока объявления сохраняются только у тебя
let ads = JSON.parse(localStorage.getItem('ads')) || [];

function addAd() {
  let what = document.getElementById('what').value;
  let price = document.getElementById('price').value;
  let contact = document.getElementById('contact').value;
  
  if(!what || !price || !contact) return alert('Заполни все поля!');
  
  ads.unshift({what, price, contact, date: new Date().toLocaleDateString()});
  localStorage.setItem('ads', JSON.stringify(ads));
  showAds();
  
  document.getElementById('what').value = '';
  document.getElementById('price').value = '';
  document.getElementById('contact').value = '';
}

function showAds() {
  document.getElementById('ads').innerHTML = ads.map(ad => `
    <div class="ad">
      <b>Куплю:</b> ${ad.what}<br>
      <b>Цена до:</b> ${ad.price}<br>
      <b>Контакты:</b> ${ad.contact}<br>
      <small>${ad.date}</small>
    </div>
  `).join('');
}

showAds();
</script>
</body>
</html>
